server:
  port: 5006

spring:
  application:
    name: pricing-service

  datasource:
    url: jdbc:mysql://localhost:3306/pf_airline_pricing_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          order_inserts: true
          order_updates: true
        dialect: org.hibernate.dialect.MySQLDialect